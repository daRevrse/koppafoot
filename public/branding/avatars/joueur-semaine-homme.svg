<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760">
  <!-- L'avatar du joueur de la semaine : voir lib/og-joueur-semaine, `chargerAvatar`. -->
  <defs>
    <radialGradient id="fond" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#2f3835"/>
      <stop offset="1" stop-color="#121514"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="maillot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fd9a0"/>
      <stop offset="1" stop-color="#0a8a5f"/>
    </linearGradient>
    <linearGradient id="peau" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9704a"/>
      <stop offset="1" stop-color="#8a5636"/>
    </linearGradient>
    <linearGradient id="cou" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f4227"/>
      <stop offset="1" stop-color="#8a5636"/>
    </linearGradient>
    <clipPath id="torse">
      <path d="M70 760 C 78 628, 150 566, 262 534 L 438 534 C 550 566, 622 628, 630 760 Z"/>
    </clipPath>
  </defs>
  <rect width="700" height="760" fill="url(#fond)"/>
  <!-- les projecteurs : des rayons derrière la tête -->
  <g fill="#34d399" opacity="0.09">
    <path d="M350 330 L374 -570 L514 -555 Z"/>
    <path d="M350 330 L762 -470 L882 -396 Z"/>
    <path d="M350 330 L1068 -213 L1144 -94 Z"/>
    <path d="M350 330 L1232 153 L1249 293 Z"/>
    <path d="M350 330 L1222 553 L1176 687 Z"/>
    <path d="M350 330 L1039 909 L940 1010 Z"/>
    <path d="M350 330 L719 1151 L586 1198 Z"/>
    <path d="M350 330 L326 1230 L186 1215 Z"/>
    <path d="M350 330 L-62 1130 L-182 1056 Z"/>
    <path d="M350 330 L-368 873 L-444 754 Z"/>
    <path d="M350 330 L-532 507 L-549 367 Z"/>
    <path d="M350 330 L-522 107 L-476 -27 Z"/>
    <path d="M350 330 L-339 -249 L-240 -350 Z"/>
    <path d="M350 330 L-19 -491 L114 -538 Z"/>
  </g>
  <circle cx="350" cy="330" r="330" fill="url(#halo)"/>
  <!-- les étincelles de la fête -->
  <path d="M118 130 Q123.6 144.4 138 150 Q123.6 155.6 118 170 Q112.4 155.6 98 150 Q112.4 144.4 118 130 Z" fill="#fbbf24" opacity="1"/>
  <path d="M560 83 Q563.64 92.36 573 96 Q563.64 99.64 560 109 Q556.36 99.64 547 96 Q556.36 92.36 560 83 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M84 407 Q87.08 414.92 95 418 Q87.08 421.08 84 429 Q80.92 421.08 73 418 Q80.92 414.92 84 407 Z" fill="#ffffff" opacity="0.75"/>
  <path d="M196 69 Q198.52 75.48 205 78 Q198.52 80.52 196 87 Q193.48 80.52 187 78 Q193.48 75.48 196 69 Z" fill="#34d399" opacity="1"/>
  <path d="M486 164 Q488.24 169.76 494 172 Q488.24 174.24 486 180 Q483.76 174.24 478 172 Q483.76 169.76 486 164 Z" fill="#fbbf24" opacity="0.9"/>
  <circle cx="160" cy="300" r="6" fill="#fbbf24"/>
  <circle cx="610" cy="470" r="5" fill="#34d399"/>
  <circle cx="64" cy="250" r="4" fill="#ffffff" opacity="0.7"/>
  <rect x="520" y="560" width="16" height="7" rx="3" fill="#fbbf24" transform="rotate(-30 528 563)"/>
  <rect x="136" y="520" width="16" height="7" rx="3" fill="#ffffff" opacity="0.8" transform="rotate(24 144 523)"/>

  <!-- le bras levé : la manche, l'avant-bras, le poing serré -->
  <path d="M548 606 L 604 470" stroke="url(#maillot)" stroke-width="104" stroke-linecap="round" fill="none"/>
  <path d="M548 606 L 604 470" stroke="#0a7f57" stroke-width="104" stroke-linecap="round" fill="none" opacity="0.35"/>
  <path d="M600 478 L 626 318" stroke="#8a5636" stroke-width="66" stroke-linecap="round" fill="none"/>
  <path d="M588 476 L 614 316" stroke="#a9704a" stroke-width="30" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M574 448 L 640 462" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none"/>
  <g transform="rotate(8 630 268)">
    <rect x="584" y="222" width="94" height="88" rx="30" fill="url(#peau)"/>
    <path d="M608 226 L 606 262 M 631 224 L 630 262 M 654 228 L 654 262" stroke="#6f4227" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M590 268 Q 626 250 664 276 L 672 292 Q 630 276 592 292 Z" fill="#9a6340"/>
    <path d="M590 270 Q 626 252 664 278" stroke="#6f4227" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <!-- les épaules et le maillot -->
  <path d="M70 760 C 78 628, 150 566, 262 534 L 438 534 C 550 566, 622 628, 630 760 Z" fill="url(#maillot)"/>
  <g clip-path="url(#torse)">
    <!-- les bandes du maillot -->
    <path d="M206 520 L 246 520 L 226 760 L 176 760 Z M454 520 L 494 520 L 524 760 L 474 760 Z" fill="#ffffff" opacity="0.10"/>
    <!-- la manche du bras au repos, un ton plus sombre -->
    <path d="M70 760 C 74 690, 100 640, 150 596 L 190 760 Z" fill="#0a7f57" opacity="0.6"/>
    <path d="M150 596 L 190 760" stroke="#086b49" stroke-width="5" fill="none" opacity="0.7"/>
    <!-- l'ombre du menton sur le haut du maillot -->
    <ellipse cx="350" cy="548" rx="150" ry="34" fill="#086b49" opacity="0.35"/>
  </g>
  <!-- le ballon sur le coeur -->
  <circle cx="462" cy="664" r="32" fill="#0b0b0b" opacity="0.22"/>
  <circle cx="462" cy="664" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5"/>
  <path d="M462 646 L 479 658 L 473 678 L 451 678 L 445 658 Z" fill="#ffffff" fill-opacity="0.85"/>
  <!-- le cou, dans l'ombre du menton -->
  <path d="M300 430 L 400 430 L 412 540 Q 350 584 288 540 Z" fill="url(#cou)"/>
  <!-- le col en V -->
  <path d="M262 534 L 350 630 L 438 534 L 410 534 L 350 596 L 290 534 Z" fill="#0b0b0b"/>
  <path d="M262 534 L 350 630 L 438 534" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <!-- la tête, penchée : quelqu'un qui fête, pas une photo d'identité -->
  <g transform="rotate(-5 350 440)">

    <!-- les oreilles -->
    <ellipse cx="234" cy="326" rx="19" ry="32" fill="#8a5636"/>
    <ellipse cx="466" cy="326" rx="19" ry="32" fill="#8a5636"/>
    <path d="M230 312 Q 222 326 232 342 M470 312 Q 478 326 468 342" stroke="#6f4227" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- le visage -->
    <path d="M236 300 C 234 200, 288 158, 350 158 C 412 158, 466 200, 464 300 C 464 372, 432 446, 350 462 C 268 446, 236 372, 236 300 Z" fill="url(#peau)"/>
    <!-- la lumière sur la joue, l'ombre de l'autre côté -->
    <path d="M250 300 C 250 220, 296 176, 340 172 C 296 196, 276 250, 280 330 C 282 372, 300 410, 322 436 C 276 410, 250 360, 250 300 Z" fill="#c08a60" opacity="0.24"/>
    <path d="M452 300 C 450 376, 420 432, 372 452 C 414 420, 432 370, 434 300 Z" fill="#6f4227" opacity="0.35"/>
    <!-- les sourcils, haussés : la joie -->
    <path d="M272 290 Q 300 270 328 286 M372 286 Q 400 270 428 290" stroke="#17110e" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- les yeux, plissés par le sourire -->
    <path d="M276 318 Q 300 296 324 318 Q 300 332 276 318 Z" fill="#ffffff"/>
    <path d="M376 318 Q 400 296 424 318 Q 400 332 376 318 Z" fill="#ffffff"/>
    <circle cx="301" cy="316" r="10" fill="#2a1a10"/>
    <circle cx="401" cy="316" r="10" fill="#2a1a10"/>
    <circle cx="305" cy="312" r="3.5" fill="#ffffff"/>
    <circle cx="405" cy="312" r="3.5" fill="#ffffff"/>
    <path d="M276 318 Q 300 296 324 318 M376 318 Q 400 296 424 318" stroke="#17110e" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M280 334 Q 300 342 320 334 M380 334 Q 400 342 420 334" stroke="#6f4227" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- le nez -->
    <path d="M352 322 C 348 346, 338 358, 334 366 Q 350 380 368 366" stroke="#6f4227" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
    <!-- le grand sourire -->
    <path d="M292 388 Q 350 404 408 388 Q 396 440 350 444 Q 304 440 292 388 Z" fill="#3a1210"/>
    <path d="M300 392 Q 350 406 400 392 Q 396 412 350 416 Q 304 412 300 392 Z" fill="#ffffff"/>
    <path d="M322 432 Q 350 420 378 432 Q 350 446 322 432 Z" fill="#c2545a"/>
    <path d="M292 388 Q 350 404 408 388" stroke="#5a2a1c" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M292 388 Q 304 440 350 444 Q 396 440 408 388" stroke="#5a2a1c" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- les fossettes -->
    <path d="M276 376 Q 268 392 278 406 M424 376 Q 432 392 422 406" stroke="#6f4227" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- le dégradé court : les côtés rasés, le dessus plus dense -->
    <path d="M236 300 C 226 196, 286 138, 350 138 C 414 138, 474 196, 464 300 C 458 250, 440 222, 414 212 C 380 200, 320 200, 286 212 C 260 222, 242 250, 236 300 Z" fill="#17110e"/>
    <path d="M270 190 C 296 152, 404 152, 430 190 C 400 172, 300 172, 270 190 Z" fill="#3a2e28" opacity="0.8"/>

  </g>
</svg>
